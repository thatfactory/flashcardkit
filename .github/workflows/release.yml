---
name: Release
run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test Release
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Run Tests
        run: swift test -v

  build-docs:
    name: Build DocC
    runs-on: [self-hosted, macOS]
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Generate DocC
        run: |
          set -euo pipefail
          swift package --allow-writing-to-directory ./public generate-documentation \
            --target FlashcardKit \
            --disable-indexing \
            --output-path ./public \
            --transform-for-static-hosting \
            --hosting-base-path flashcardkit

          cat > ./public/index.html <<'INDEX'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=/flashcardkit/documentation/flashcardkit/" />
          <title>FlashcardKit Documentation</title>
          INDEX

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          name: github-pages

  deploy-docs:
    name: Deploy DocC
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
